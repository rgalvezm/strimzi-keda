apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-app
  namespace: kafka

spec:
  replicas: 0

  selector:
    matchLabels:
      app: kafka-consumer

  template:
    metadata:
      labels:
        app: kafka-consumer

    spec:
      containers:
        - name: consumer
          image: quay.io/strimzi/kafka:0.45.2-kafka-3.8.0

          command:
            - /bin/bash
            - -c

          args:
            - |
              echo "Starting Kafka consumer..."

              bin/kafka-console-consumer.sh \
                --bootstrap-server edu-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092 \
                --topic scaling-demo \
                --group demo-consumer-group \
                --from-beginning \
              | while read message
                do
                  echo "Processing: $message"
                  sleep 2
                done

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"

            limits:
              memory: "256Mi"
              cpu: "200m"

          env:
            - name: KAFKA_OPTS
              value: "-Xmx128m -Xms64m"