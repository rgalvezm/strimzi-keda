apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: edu-cluster
  namespace: kafka

spec:
  kafka:
    version: 3.8.0
    replicas: 1

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

      log.retention.hours: 1

    storage:
      type: ephemeral

    resources:
      requests:
        memory: 1Gi
        cpu: "500m"
      limits:
        memory: 2Gi
        cpu: "1"

  zookeeper:
    replicas: 1

    storage:
      type: ephemeral

    resources:
      requests:
        memory: 256Mi
        cpu: "100m"
      limits:
        memory: 512Mi
        cpu: "300m"

    jvmOptions:
      -Xms: 256m
      -Xmx: 256m

  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: "50m"
        limits:
          memory: 256Mi
          cpu: "200m"

    userOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: "50m"
        limits:
          memory: 256Mi
          cpu: "200m"